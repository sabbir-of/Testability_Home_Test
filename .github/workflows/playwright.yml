name: Playwright E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly regression run at 02:00 UTC — catches breakage in the hosted app
    # even when nobody has pushed.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: Browser project to run
        type: choice
        default: all
        options: [all, chromium, firefox, webkit]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # One browser failing should not hide the results of the others.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Chromium is needed in every job, not just the Chromium one: the shared
      # authentication setup project runs in it before the browser under test.
      - name: Install Playwright browsers (chromium + ${{ matrix.project }})
        run: npx playwright install --with-deps chromium ${{ matrix.project }}

      # The blob reporter lets the three browser jobs be merged afterwards into
      # a single HTML report rather than three disconnected ones.
      - name: Run Playwright tests
        if: github.event.inputs.browser == null || github.event.inputs.browser == 'all' || github.event.inputs.browser == matrix.project
        run: npx playwright test --project=${{ matrix.project }} --reporter=blob,allure-playwright
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://conduit.bondaracademy.com' }}
          API_URL: ${{ vars.API_URL || 'https://conduit-api.bondaracademy.com/api' }}
          CONDUIT_EMAIL: ${{ secrets.CONDUIT_EMAIL }}
          CONDUIT_PASSWORD: ${{ secrets.CONDUIT_PASSWORD }}
          CONDUIT_USERNAME: ${{ secrets.CONDUIT_USERNAME }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          retention-days: 14

      # Uploaded on failure only — these are what is needed to diagnose a red run.
      - name: Upload traces, screenshots and video
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 14

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 14

  report:
    name: Publish report
    needs: [test]
    # Runs even when tests fail: the report of a red run is the one worth reading.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports from every browser
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # One report covering all three browsers, filterable by project in the UI.
      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  # Publishes the merged report to GitHub Pages. Kept as its own job so the
  # Pages write permission is scoped to it alone, and limited to main so that
  # a pull request never overwrites the published report.
  deploy-report:
    name: Deploy report to Pages
    needs: [report]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Link the published report
        run: echo "📊 Test report published to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
